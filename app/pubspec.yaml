name: bougette
description: "Local-first budgets, individual and shared"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_rust_bridge: 2.13.0
  # Formats amounts and dates per language; the version flutter_localizations
  # pins. Licence: BSD-3-Clause.
  intl: 0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Generates the translations (lib/l10n/) from the .arb files.
  generate: true
