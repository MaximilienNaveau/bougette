# The Cargo workspace: the Rust equivalent of a top-level CMakeLists.txt
# with add_subdirectory() for each crate (a crate ≈ a CMake target with its
# own dependencies). All crates share one Cargo.lock and one target/ dir.
[workspace]
members = [
    "crates/bougette-core",
    "crates/bougette-store",
    "crates/bougette-cli",
    "crates/bougette-sync",
    "crates/bougette-server",
]
# Version 3 of Cargo's dependency resolver, the default for edition 2024.
resolver = "3"

# Settings each crate inherits with `<key>.workspace = true`.
[workspace.package]
version = "0.1.0"
# The Rust edition: like -std=c++20, it picks the language revision.
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/MaximilienNaveau/bougette"
