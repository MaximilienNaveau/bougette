name: CI

# Everything is built by the repository's flake, with the same command as
# locally: `nix flake check -L`.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  check:
    name: nix flake check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      # Pulls from the baxter cache (shared with the trampoline game), and
      # pushes what this job builds to it (only when the CACHIX_AUTH_TOKEN
      # secret is there: not on forks' PRs). The cache is public: once the
      # Android SDK comes in, it must be kept out with a `pushFilter`
      # (unfree, Google's licence forbids redistributing it).
      - name: Use the baxter Cachix cache
        uses: cachix/cachix-action@v17
        with:
          name: baxter
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Run every check of the flake
        run: nix flake check -L

      # Known vulnerabilities in the dependencies (deny.toml). Outside the
      # flake's checks: it downloads the RustSec advisory database.
      - name: Check the dependencies for security advisories
        run: nix develop -c cargo deny check advisories

      # The app's analysis and widget tests, on the Rust library Nix built,
      # with a real server for the members' screens.
      - name: Analyze and test the Flutter app
        run: |
          nix build .#api -o api
          nix build .#server -o server
          nix develop -c sh -c 'cd app && flutter analyze && \
            BOUGETTE_LIB=$PWD/../api/lib/libbougette_api.so \
            BOUGETTE_SERVER=$PWD/../server/bin/bougette-server flutter test'
