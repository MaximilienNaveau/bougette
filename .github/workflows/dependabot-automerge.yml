name: Dependabot auto-merge

# Turns on GitHub's auto-merge for Dependabot's PRs: GitHub then merges
# each one by itself once the required check passes (the `nix flake check`
# job of ci.yml, required on `main` by the repository's ruleset; without
# that rule, auto-merge would merge straight away, untested).
#
# Merged automatically: every flake.lock and Cargo.lock update below a
# major version, and patch/minor updates of GitHub Actions. Major updates
# are left for a human to review.
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Read what Dependabot updates
        id: meta
        uses: dependabot/fetch-metadata@v3

      - name: Enable auto-merge
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
