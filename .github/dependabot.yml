version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  # flake.lock: nixpkgs (the whole toolchain) and flake-utils. Each
  # update's PR runs `nix flake check` in CI before it can be merged.
  - package-ecosystem: "nix"
    directory: "/"
    schedule:
      interval: "weekly"
  # Cargo.lock: the Rust crates of the workspace.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
