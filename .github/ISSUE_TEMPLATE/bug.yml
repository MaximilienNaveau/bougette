name: Bug report
description: Something doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste real financial data.** Replace amounts, names and
        accounts with made-up ones.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a shared budget…
        2. …
  - type: input
    id: version
    attributes:
      label: App version
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options: [Android, Linux, Windows, macOS, iOS, Web]
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Installed from
      options: [F-Droid, nixpkgs, GitHub release, Built from source, Other]
