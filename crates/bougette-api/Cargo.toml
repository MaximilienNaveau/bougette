[package]
name = "bougette-api"
description = "Bougette's API for the Flutter app: ready-to-show views and user actions"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# A shared library the app loads (`cdylib`, like a .so built by
# add_library(SHARED) in CMake), and a Rust library for the tests.
crate-type = ["cdylib", "lib"]

[dependencies]
# The runtime half of the bridge to Dart; the same version as the Dart
# package and the code generator, or the generated code won't match.
# Licence: MIT.
flutter_rust_bridge = "=2.13.0"
bougette-core = { path = "../bougette-core" }
bougette-store = { path = "../bougette-store" }
# The server operations, shared with the CLI, and the runtime they need.
bougette-sync = { path = "../bougette-sync" }
tokio = { version = "1.54", features = ["rt-multi-thread", "net", "time"] }
# To read the identifiers the app sends back.
uuid = "1.29"
# Dates, and today's date in the system's time zone (as in the CLI).
jiff = { version = "1.0", default-features = false, features = [
    "std",
    "tz-system",
    "tzdb-zoneinfo",
] }
